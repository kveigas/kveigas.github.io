    <style>
        .nav-link {
            position: relative;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: var(--text-primary);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: var(--text-primary);
            transition: width 0.3s;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 2px;
            background: var(--text-primary);
            margin-top: 1rem;
        }

        .tech-tag {
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            /* For tooltip positioning */
            cursor: default;
        }

        /* Tooltip logic moved to React for header clearance detection */

        .tooltip-content {
            position: absolute;
            bottom: 125%;
            /* Above the element */
            left: 0;
            width: 300px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-highlight);
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.5;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-transform: none;
            /* Reset uppercase */
            pointer-events: none;
        }

        /* Force Button Colors on Visit/Click - LVHA Order */
        .btn-primary:visited {
            color: #000000 !important;
            background: #ffffff !important;
        }

        .btn-primary:hover {
            color: #000000 !important;
            background: #ffffff !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        .btn-primary:active,
        .btn-primary:focus {
            color: #000000 !important;
            background: #ffffff !important;
            transform: translateY(0);
        }
    </style>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            ArrowDown: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14" /><path d="m19 12-7 7-7-7" /></svg>,
            External: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></svg>,
            Play: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3" /></svg>,
            Mail: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>,
            Linkedin: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" /><rect width="4" height="12" x="2" y="9" /><circle cx="4" cy="4" r="2" /></svg>,
            MapPin: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>
        };

        // --- 3D Background (Dual Waves + Morphing Globe) ---
        const WaveBackground = () => {
            useEffect(() => {
                const container = document.getElementById('canvas-container');
                if (!container) return;
                while (container.firstChild) container.removeChild(container.firstChild);

                const scene = new THREE.Scene();

                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(renderer.domElement);

                // --- Helper Phase: Create Wave ---
                const createWave = (color, yPos, speedX, phaseOffset) => {
                    const SEPARATION = 1.3;
                    const AMOUNTX = 50;
                    const AMOUNTY = 50;
                    const numParticles = AMOUNTX * AMOUNTY;
                    const positions = new Float32Array(numParticles * 3);
                    let i = 0;
                    for (let ix = 0; ix < AMOUNTX; ix++) {
                        for (let iy = 0; iy < AMOUNTY; iy++) {
                            positions[i] = ix * SEPARATION - ((AMOUNTX * SEPARATION) / 2);
                            positions[i + 1] = 0;
                            positions[i + 2] = iy * SEPARATION - ((AMOUNTY * SEPARATION) / 2);
                            i += 3;
                        }
                    }
                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    const material = new THREE.PointsMaterial({
                        color: color,
                        size: 0.12,
                        transparent: true,
                        opacity: 0.7
                    });
                    const particles = new THREE.Points(geometry, material);
                    particles.position.y = yPos;
                    scene.add(particles);
                    return { mesh: particles, speedX: speedX, phase: phaseOffset, amountX: AMOUNTX, amountY: AMOUNTY };
                };

                const whiteWave = createWave(0xffffff, -5, 0.03, 0);
                const greenWave = createWave(0x10b981, -5, -0.03, 10);

                // --- Helper Phase: Create Morphing Globe ---
                // We manually create points to control their "unravel" state
                const globeParticleCount = 1800;
                const globeGeo = new THREE.BufferGeometry();
                const globePos = new Float32Array(globeParticleCount * 3);
                const globeOrigins = new Float32Array(globeParticleCount * 3); // Store sphere state
                const globeDestinations = new Float32Array(globeParticleCount * 3); // Store unraveled state

                const radius = 7;
                for (let i = 0; i < globeParticleCount; i++) {
                    // Spherical coordinates (Golden Spiral) to distribute points evenly
                    const phi = Math.acos(-1 + (2 * i) / globeParticleCount);
                    const theta = Math.sqrt(globeParticleCount * Math.PI) * phi;

                    const x = radius * Math.cos(theta) * Math.sin(phi);
                    const y = radius * Math.sin(theta) * Math.sin(phi);
                    const z = radius * Math.cos(phi);

                    // Origin (Sphere)
                    globeOrigins[i * 3] = x;
                    globeOrigins[i * 3 + 1] = y;
                    globeOrigins[i * 3 + 2] = z;

                    // Start at origin
                    globePos[i * 3] = x;
                    globePos[i * 3 + 1] = y;
                    globePos[i * 3 + 2] = z;

                    // Destination (Unraveled / Spiral Cloud)
                    // We make a larger, wider spiral
                    const spiralScale = 0.5;
                    globeDestinations[i * 3] = x * 2 + (Math.random() - 0.5) * 10;
                    globeDestinations[i * 3 + 1] = y * 2 + (Math.random() - 0.5) * 10;
                    globeDestinations[i * 3 + 2] = z * 2 + (Math.random() - 0.5) * 10;
                }

                globeGeo.setAttribute('position', new THREE.BufferAttribute(globePos, 3));
                const globeMat = new THREE.PointsMaterial({
                    color: 0x34d399,
                    size: 0.1,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending
                });
                const globeMesh = new THREE.Points(globeGeo, globeMat);
                globeMesh.position.y = 0; // Explicitly center vertically
                scene.add(globeMesh);

                camera.position.y = 4; // Slightly lower angle for better center alignment
                camera.position.z = 25;
                camera.lookAt(0, 0, 0);

                // Scroll Tracker
                let scrollY = 0;
                const handleScroll = () => {
                    scrollY = window.scrollY;
                };
                window.addEventListener('scroll', handleScroll);

                let count = 0;

                const animate = () => {
                    requestAnimationFrame(animate);

                    // 1. Animate Waves
                    [whiteWave, greenWave].forEach(wave => {
                        const positions = wave.mesh.geometry.attributes.position.array;
                        let i = 0;
                        for (let ix = 0; ix < wave.amountX; ix++) {
                            for (let iy = 0; iy < wave.amountY; iy++) {
                                const value = (Math.sin((ix + count + wave.phase) * 0.3) * 1.5) +
                                    (Math.sin((iy + count + wave.phase) * 0.5) * 1.5);
                                positions[i + 1] = value;
                                i += 3;
                            }
                        }
                        wave.mesh.geometry.attributes.position.needsUpdate = true;
                    });

                    whiteWave.mesh.rotation.y += 0.001;
                    greenWave.mesh.rotation.y -= 0.001;

                    // 2. Animate Globe Morphing (Unraveling)
                    const morphTime = count * 0.5;
                    let morphFactor = (Math.sin(morphTime) + 1) / 2; // 0 -> 1 -> 0

                    // Non-linear easing for "Pop" effect
                    morphFactor = Math.pow(morphFactor, 2);

                    const gPositions = globeMesh.geometry.attributes.position.array;
                    for (let i = 0; i < globeParticleCount; i++) {
                        const ix = i * 3;
                        const iy = i * 3 + 1;
                        const iz = i * 3 + 2;

                        // Lerp between Origin and Destination
                        gPositions[ix] = globeOrigins[ix] + (globeDestinations[ix] - globeOrigins[ix]) * morphFactor;
                        gPositions[iy] = globeOrigins[iy] + (globeDestinations[iy] - globeOrigins[iy]) * morphFactor;
                        gPositions[iz] = globeOrigins[iz] + (globeDestinations[iz] - globeOrigins[iz]) * morphFactor;
                    }
                    globeMesh.geometry.attributes.position.needsUpdate = true;

                    // Rotate the entire globe group
                    globeMesh.rotation.y += 0.002;

                    // 3. Scroll Floating (Parallax)
                    // Start at 0 (Center), drift down slightly as user scrolls
                    const targetY = 0 - (scrollY * 0.012);
                    globeMesh.position.y += (targetY - globeMesh.position.y) * 0.05;

                    count += 0.02;
                    renderer.render(scene, camera);
                };
                animate();

                // Cleanup
                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    window.removeEventListener('scroll', handleScroll);
                };
            }, []);
            return null;
        };

        const Navbar = () => {

        const ImpactStrip = () => {

        const GhostOortDemo = () => {
            const [annotators, setAnnotators] = useState([

                { name: "T-800", score: 85, role: "Bot", speed: "Max" }, // Starts lower due to accuracy penalty

                    <div style={{ marginBottom: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

                    </div>

        const Projects = () => {
            const { projects } = window.PORTFOLIO_DATA;

                                </button>

                                <p style={{ fontSize: '1.05rem', color: 'var(--text-secondary)', lineHeight: 1.6, marginBottom: '2rem' }}>
                                    {featured.description}
                                </p>
                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.8rem', marginBottom: '2rem' }}>
                                    {featured.tags.map(tag => (
                                        <span key={tag} className="tech-tag">{tag}</span>
                                    ))}
                                </div>
                                <div style={{ display: 'flex', gap: '1rem', flexWrap: 'wrap' }}>
                                    <a href={featured.demoUrl} target="_blank" rel="noopener noreferrer" className="btn-primary" style={{ textDecoration: 'none', color: 'black' }}>
                                        Launch Data Dashboard <Icons.External />
                                    </a>
                                </div>
                            </div>

                            {/* Interactive Demo Side */}
                            <div style={{
                                background: 'linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(59, 130, 246, 0.1))',
                                padding: '3rem',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                borderLeft: '1px solid var(--glass-border)',
                                borderTopRightRadius: '12px',
                                borderBottomRightRadius: '12px',
                            }}>
                                <GhostOortDemo />
                            </div>
                        </div>
                    )}

                    {/* Case Study Modal Popup */}
                    {showModal && featured && featured.caseStudy && (
                        <div style={{
                            position: 'fixed',
                            top: 0,
                            left: 0,
                            width: '100vw',
                            height: '100vh',
                            background: 'rgba(5, 8, 16, 0.92)',
                            backdropFilter: 'blur(12px)',
                            WebkitBackdropFilter: 'blur(12px)',
                            zIndex: 99999,
                            display: 'flex',
                            alignItems: 'flex-start',
                            justifyContent: 'center',
                            overflowY: 'auto',
                            padding: '2.5rem 1rem'
                        }} onClick={handleClose}>
                            <div style={{
                                background: '#0f172a',
                                border: '1px solid #10b981',
                                borderRadius: '12px',
                                maxWidth: '750px',
                                width: '100%',
                                margin: 'auto 0',
                                padding: '2.5rem',
                                boxShadow: '0 25px 60px rgba(0,0,0,0.9)',
                                color: '#e2e8f0',
                                position: 'relative'
                            }} onClick={(e) => e.stopPropagation()}>
                                {/* Sticky Header with Close Button */}
                                <div style={{
                                    position: 'sticky',
                                    top: '-2.5rem',
                                    marginTop: '-2.5rem',
                                    marginLeft: '-2.5rem',
                                    marginRight: '-2.5rem',
                                    padding: '1.5rem 2.5rem 1rem 2.5rem',
                                    background: '#0f172a',
                                    borderBottom: '1px solid rgba(255, 255, 255, 0.1)',
                                    marginBottom: '1.5rem',
                                    zIndex: 10,
                                    borderTopLeftRadius: '12px',
                                    borderTopRightRadius: '12px'
                                }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                        <div>
                                            <div style={{ color: '#10b981', fontSize: '0.8rem', fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: '0.2rem' }}>
                                                Case Study Deep-Dive
                                            </div>
                                            <h3 style={{ fontSize: '1.5rem', color: '#fff', margin: 0, lineHeight: 1.3 }}>
                                                {featured.caseStudy.title}
                                            </h3>
                                        </div>
                                        <button type="button" onClick={handleClose} style={{
                                            background: 'rgba(255,255,255,0.08)',
                                            border: '1px solid var(--glass-border)',
                                            color: '#fff',
                                            fontSize: '1.2rem',
                                            cursor: 'pointer',
                                            width: '36px',
                                            height: '36px',
                                            borderRadius: '50%',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            flexShrink: 0,
                                            marginLeft: '1rem',
                                            transition: 'all 0.2s'
                                        }} onMouseOver={(e) => { e.currentTarget.style.background = '#ef4444'; e.currentTarget.style.borderColor = '#ef4444'; }} onMouseOut={(e) => { e.currentTarget.style.background = 'rgba(255,255,255,0.08)'; e.currentTarget.style.borderColor = 'var(--glass-border)'; }}>✕</button>
                                    </div>
                                </div>

                                <div style={{ marginBottom: '1.5rem' }}>
                                    <h4 style={{ color: '#38bdf8', fontSize: '1.1rem', marginBottom: '0.5rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        🎯 The Operational Challenge
                                    </h4>
                                    <p style={{ lineHeight: 1.6, color: '#cbd5e1', fontSize: '0.95rem' }}>
                                        {featured.caseStudy.problem}
                                    </p>
                                </div>

                                <div style={{ marginBottom: '1.5rem' }}>
                                    <h4 style={{ color: '#34d399', fontSize: '1.1rem', marginBottom: '0.5rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        ⚙️ Engineering & Quality Solution
                                    </h4>
                                    <p style={{ lineHeight: 1.6, color: '#cbd5e1', fontSize: '0.95rem' }}>
                                        {featured.caseStudy.solution}
                                    </p>
                                </div>

                                <div style={{ marginBottom: '2rem' }}>
                                    <h4 style={{ color: '#fbbf24', fontSize: '1.1rem', marginBottom: '0.8rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        📈 Measurable Results & Business Impact
                                    </h4>
                                    <ul style={{ listStyle: 'none', paddingLeft: 0 }}>
                                        {featured.caseStudy.impact.map((item, idx) => (
                                            <li key={idx} style={{ marginBottom: '0.6rem', display: 'flex', alignItems: 'start', gap: '0.6rem', color: '#e2e8f0', fontSize: '0.95rem' }}>
                                                <span style={{ color: '#10b981', fontWeight: 'bold' }}>✓</span>
                                                {item}
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                <div style={{ display: 'flex', gap: '1rem', justifyContent: 'flex-end', paddingTop: '1.2rem', borderTop: '1px solid rgba(255,255,255,0.1)' }}>
                                    <a href={featured.demoUrl} target="_blank" rel="noopener noreferrer" className="btn-primary" style={{ textDecoration: 'none', color: 'black', padding: '0.6rem 1.4rem', fontSize: '0.9rem' }}>
                                        Launch Interactive Dashboard <Icons.External />
                                    </a>
                                    <button type="button" onClick={handleClose} style={{
                                        background: 'rgba(255,255,255,0.1)',
                                        border: '1px solid var(--glass-border)',
                                        color: '#fff',
                                        padding: '0.6rem 1.2rem',
                                        borderRadius: '4px',
                                        cursor: 'pointer',
                                        fontSize: '0.9rem'
                                    }}>
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </section>
            );
        };

        const Education = () => {
            const { education, certifications } = window.PORTFOLIO_DATA;
            return (
                <section id="education" className="container">
                    <h2 className="section-title">Education &amp; Certifications</h2>
                    <div className="education-cert-grid">
                        <div className="education-list">
                            {education.map((edu, index) => (
                                <div key={index} className="glass-panel education-item">
                                    <div>
                                        <h3>{edu.degree}</h3>
                                        <div>{edu.school}, {edu.location}</div>
                                    </div>
                                    {edu.year && <span className="education-year">{edu.year}</span>}
                                </div>
                            ))}
                        </div>
                        <div className="glass-panel certification-list">
                            <h3>Professional Certifications</h3>
                            <ul>
                                {certifications.map((cert, index) => (
                                    <li key={cert}>
                                        <span className="certification-marker" aria-hidden="true"></span>
                                        {cert}
                                    </li>
                                ))}
                            </ul>
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = () => {
            return (
                <section id="contact" className="container" style={{ marginBottom: '4rem' }}>
                    <h2 className="section-title">Contact</h2>
                    <div style={{ maxWidth: '600px' }}>
                        <p style={{ fontSize: '1.2rem', marginBottom: '2rem', color: 'var(--text-secondary)' }}>
                            Open to remote and global opportunities across AI data operations, evaluation, project operations, and technical QA.
                        </p>
                        <a href="mailto:kveigas825@gmail.com" className="btn-primary" style={{ color: 'black', background: 'white', textDecoration: 'none' }}>
                            <Icons.Mail /> kveigas825@gmail.com
                        </a>
                    </div>
                </section>
            );
        }

        const Footer = () => {
            return (
                <footer style={{
                    borderTop: '1px solid var(--glass-border)',
                    padding: '3rem 0',
                    textAlign: 'center',
                    background: '#0a0c0f'
                }}>
                    <div className="container" style={{ display: 'flex', justifyContent: 'center', color: '#555' }}>
                        <span>© 2026 Kevin Prashant Veigas. All rights reserved.</span>
                    </div>
                </footer>
            );
        }

        const App = () => {
            return (
                <React.Fragment>
                    <WaveBackground />
                    <div className="vignette-overlay"></div>
                    <Navbar />
                    <Hero />
                    <ImpactStrip />
                    <Experience />
                    <Projects />
                    <CoreCapabilities />
                    <Education />
                    <Contact />
                    <Footer />
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
