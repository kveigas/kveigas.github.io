    <style>
        .nav-link {
            position: relative;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: var(--text-primary);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: var(--text-primary);
            transition: width 0.3s;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 2px;
            background: var(--text-primary);
            margin-top: 1rem;
        }

        .tech-tag {
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            /* For tooltip positioning */
            cursor: default;
        }

        /* Tooltip logic moved to React for header clearance detection */

        .tooltip-content {
            position: absolute;
            bottom: 125%;
            /* Above the element */
            left: 0;
            width: 300px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-highlight);
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.5;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-transform: none;
            /* Reset uppercase */
            pointer-events: none;
        }

        /* Force Button Colors on Visit/Click - LVHA Order */
        .btn-primary:visited {
            color: #000000 !important;
            background: #ffffff !important;
        }

        .btn-primary:hover {
            color: #000000 !important;
            background: #ffffff !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        .btn-primary:active,
        .btn-primary:focus {
            color: #000000 !important;
            background: #ffffff !important;
            transform: translateY(0);
        }
    </style>
</head>

        const Icons = {
            ArrowDown: () => <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14" /><path d="m19 12-7 7-7-7" /></svg>,
            External: () => <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></svg>,
            Play: () => <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3" /></svg>,
            Mail: () => <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>,
            Linkedin: () => <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" /><rect width="4" height="12" x="2" y="9" /><circle cx="4" cy="4" r="2" /></svg>,
            MapPin: () => <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>
        };

        // --- 3D Background (Dual Waves + Morphing Globe) ---
        const WaveBackground = () => {
            useEffect(() => {
                const container = document.getElementById('canvas-container');
                if (!container) return;
                while (container.firstChild) container.removeChild(container.firstChild);

                const scene = new THREE.Scene();

                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(renderer.domElement);

                // --- Helper Phase: Create Wave ---
                const createWave = (color, yPos, speedX, phaseOffset) => {
                    const SEPARATION = 1.3;
                    const AMOUNTX = 50;
                    const AMOUNTY = 50;
                    const numParticles = AMOUNTX * AMOUNTY;
                    const positions = new Float32Array(numParticles * 3);
                    let i = 0;
                    for (let ix = 0; ix < AMOUNTX; ix++) {
                        for (let iy = 0; iy < AMOUNTY; iy++) {
                            positions[i] = ix * SEPARATION - ((AMOUNTX * SEPARATION) / 2);
                            positions[i + 1] = 0;
                            positions[i + 2] = iy * SEPARATION - ((AMOUNTY * SEPARATION) / 2);
                            i += 3;
                        }
                    }
                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    const material = new THREE.PointsMaterial({
                        color: color,
                        size: 0.12,
                        transparent: true,
                        opacity: 0.7
                    });
                    const particles = new THREE.Points(geometry, material);
                    particles.position.y = yPos;
                    scene.add(particles);
                    return { mesh: particles, speedX: speedX, phase: phaseOffset, amountX: AMOUNTX, amountY: AMOUNTY };
                };

                const whiteWave = createWave(0xffffff, -5, 0.03, 0);
                const greenWave = createWave(0x10b981, -5, -0.03, 10);

                // --- Helper Phase: Create Morphing Globe ---
                // We manually create points to control their "unravel" state
                const globeParticleCount = 1800;
                const globeGeo = new THREE.BufferGeometry();
                const globePos = new Float32Array(globeParticleCount * 3);
                const globeOrigins = new Float32Array(globeParticleCount * 3); // Store sphere state
                const globeDestinations = new Float32Array(globeParticleCount * 3); // Store unraveled state

                const radius = 7;
                for (let i = 0; i < globeParticleCount; i++) {
                    // Spherical coordinates (Golden Spiral) to distribute points evenly
                    const phi = Math.acos(-1 + (2 * i) / globeParticleCount);
                    const theta = Math.sqrt(globeParticleCount * Math.PI) * phi;

                    const x = radius * Math.cos(theta) * Math.sin(phi);
                    const y = radius * Math.sin(theta) * Math.sin(phi);
                    const z = radius * Math.cos(phi);

                    // Origin (Sphere)
                    globeOrigins[i * 3] = x;
                    globeOrigins[i * 3 + 1] = y;
                    globeOrigins[i * 3 + 2] = z;

                    // Start at origin
                    globePos[i * 3] = x;
                    globePos[i * 3 + 1] = y;
                    globePos[i * 3 + 2] = z;

                    // Destination (Unraveled / Spiral Cloud)
                    // We make a larger, wider spiral
                    const spiralScale = 0.5;
                    globeDestinations[i * 3] = x * 2 + (Math.random() - 0.5) * 10;
                    globeDestinations[i * 3 + 1] = y * 2 + (Math.random() - 0.5) * 10;
                    globeDestinations[i * 3 + 2] = z * 2 + (Math.random() - 0.5) * 10;
                }

                globeGeo.setAttribute('position', new THREE.BufferAttribute(globePos, 3));
                const globeMat = new THREE.PointsMaterial({
                    color: 0x34d399,
                    size: 0.1,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending
                });
                const globeMesh = new THREE.Points(globeGeo, globeMat);
                globeMesh.position.y = 0; // Explicitly center vertically
                scene.add(globeMesh);

                camera.position.y = 4; // Slightly lower angle for better center alignment
                camera.position.z = 25;
                camera.lookAt(0, 0, 0);

                // Scroll Tracker
                let scrollY = 0;
                const handleScroll = () => {
                    scrollY = window.scrollY;
                };
                window.addEventListener('scroll', handleScroll);

                let count = 0;
                const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                let animationFrameId = null;

                const animate = () => {
                    if (!reduceMotion) {
                        animationFrameId = requestAnimationFrame(animate);
                    }

                    // 1. Animate Waves
                    [whiteWave, greenWave].forEach(wave => {
                        const positions = wave.mesh.geometry.attributes.position.array;
                        let i = 0;
                        for (let ix = 0; ix < wave.amountX; ix++) {
                            for (let iy = 0; iy < wave.amountY; iy++) {
                                const value = (Math.sin((ix + count + wave.phase) * 0.3) * 1.5) +
                                    (Math.sin((iy + count + wave.phase) * 0.5) * 1.5);
                                positions[i + 1] = value;
                                i += 3;
                            }
                        }
                        wave.mesh.geometry.attributes.position.needsUpdate = true;
                    });

                    whiteWave.mesh.rotation.y += 0.001;
                    greenWave.mesh.rotation.y -= 0.001;

                    // 2. Animate Globe Morphing (Unraveling)
                    const morphTime = count * 0.5;
                    let morphFactor = (Math.sin(morphTime) + 1) / 2; // 0 -> 1 -> 0

                    // Non-linear easing for "Pop" effect
                    morphFactor = Math.pow(morphFactor, 2);

                    const gPositions = globeMesh.geometry.attributes.position.array;
                    for (let i = 0; i < globeParticleCount; i++) {
                        const ix = i * 3;
                        const iy = i * 3 + 1;
                        const iz = i * 3 + 2;

                        // Lerp between Origin and Destination
                        gPositions[ix] = globeOrigins[ix] + (globeDestinations[ix] - globeOrigins[ix]) * morphFactor;
                        gPositions[iy] = globeOrigins[iy] + (globeDestinations[iy] - globeOrigins[iy]) * morphFactor;
                        gPositions[iz] = globeOrigins[iz] + (globeDestinations[iz] - globeOrigins[iz]) * morphFactor;
                    }
                    globeMesh.geometry.attributes.position.needsUpdate = true;

                    // Rotate the entire globe group
                    globeMesh.rotation.y += 0.002;

                    // 3. Scroll Floating (Parallax)
                    // Start at 0 (Center), drift down slightly as user scrolls
                    const targetY = 0 - (scrollY * 0.012);
                    globeMesh.position.y += (targetY - globeMesh.position.y) * 0.05;

                    count += 0.02;
                    renderer.render(scene, camera);
                };
                animate();

                // Cleanup
                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
                window.addEventListener('resize', handleResize);

                return () => {
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    window.removeEventListener('resize', handleResize);
                    window.removeEventListener('scroll', handleScroll);
                    renderer.dispose();
                };
            }, []);
            return null;
        };

        const Navbar = () => {
            const navItems = [
                { label: 'Experience', href: '#experience' },
                { label: 'Projects', href: '#projects' },
                { label: 'Capabilities', href: '#capabilities' },
                { label: 'Education', href: '#education' },
                { label: 'Contact', href: '#contact' }
            ];

            return (
                <nav className="site-nav" aria-label="Primary navigation">
                    <a href="#top" className="site-logo" aria-label="Kevin Veigas home">
                        KV<span style={{ color: 'var(--accent-highlight)' }}>.</span>
                    </a>
                    <ul className="site-nav-links">
                        {navItems.map(item => (
                            <li key={item.href}><a href={item.href} className="nav-link">{item.label}</a></li>
                        ))}
                    </ul>
                </nav>
            );
        };

        const Hero = () => {
            const { personal } = window.PORTFOLIO_DATA;
            return (
                <section id="top" className="hero-section container">
                    <div className="hero-glow"></div>
                    <div className="hero-content">
                        <p className="hero-name">{personal.name}</p>
                        <h1 className="hero-title">AI Data Operations <span>&amp; Evaluation</span></h1>
                        <p className="hero-secondary">AI Project Operations / Technical QA</p>
                        <p className="hero-summary">
                            I build and run high-quality AI data workflows — from annotation and review operations to dataset validation, model evaluation, quality monitoring, and cross-functional delivery.
                        </p>
                        <p className="hero-status">
                            <span className="status-dot" aria-hidden="true"></span>
                            Mangaluru, India <span aria-hidden="true">·</span> Open to Remote &amp; Global Opportunities
                        </p>

                        <div className="hero-actions" aria-label="Homepage actions">
                            <a href="#projects" className="btn-primary">View Projects</a>
                            <a href="#experience" className="btn-secondary">View Experience</a>
                        </div>

                        <div className="hero-resource-links">
                            <a href={`mailto:${personal.email}?subject=Resume Request`} className="hero-text-link">
                                Request Resume
                            </a>
                            <a href={personal.linkedin} target="_blank" rel="noopener noreferrer" className="hero-text-link">
                                <Icons.Linkedin /> LinkedIn
                            </a>
                        </div>
                    </div>
                </section>
            );
        };

        const ImpactStrip = () => {
            const metrics = [
                { value: '15,000+', label: 'Images validated' },
                { value: '15', label: 'Annotation team members led' },
                { value: '99%+', label: 'Dataset quality' },
                { value: '19', label: 'Deployed AI systems monitored' },
                { value: '30%', label: 'Reduction in QA cycle time' },
                { value: '35%', label: 'Faster issue response' }
            ];

            return (
                <section className="impact-section container" aria-labelledby="impact-heading">
                    <p id="impact-heading" className="section-eyebrow">Selected operational impact</p>
                    <div className="impact-grid">
                        {metrics.map(metric => (
                            <div className="impact-item" key={metric.label}>
                                <strong className="impact-value">{metric.value}</strong>
                                <span className="impact-label">{metric.label}</span>
                            </div>
                        ))}
                    </div>
                    <p className="impact-source">Professional experience metrics, primarily from Maneva.</p>
                </section>
            );
        };

        const CoreCapabilities = () => {
            const { skills, supportingTools } = window.PORTFOLIO_DATA;
            return (
                <section id="capabilities" className="container" aria-labelledby="capabilities-heading">
                    <div className="section-heading-compact">
                        <h2 id="capabilities-heading" className="section-title">Core Capabilities</h2>
                        <p>Practical strengths across data delivery, model assessment, technical review, and project coordination.</p>
                    </div>
                    <div className="capabilities-grid">
                        {Object.entries(skills).map(([category, items]) => (
                            <article key={category} className="glass-panel capability-group">
                                <h3>{category}</h3>
                                <ul className="capability-list">
                                    {items.map(skill => (
                                        <li key={skill}>{skill}</li>
                                    ))}
                                </ul>
                            </article>
                        ))}
                    </div>
                    <div className="supporting-tools" aria-label="Supporting technical tools">
                        <span className="supporting-tools-label">Supporting tools</span>
                        <ul>
                            {supportingTools.map(tool => <li key={tool}>{tool}</li>)}
                        </ul>
                    </div>
                </section>
            );
        };

        const Experience = () => {
            const { companies } = window.PORTFOLIO_DATA;
            return (
                <section id="experience" className="container">
                    <h2 className="section-title">Professional Experience</h2>
                    <div className="experience-list">
                        {companies.map((company, index) => (
                            <article key={company.name} className="glass-panel experience-card">
                                <header className="experience-card-header">
                                    <div className="experience-identity">
                                        <div className="experience-company-line">
                                            <p className="experience-company">{company.name}</p>
                                            {company.engagementType && <span className="experience-engagement">{company.engagementType}</span>}
                                        </div>
                                        <h3 className="experience-role">{company.role}</h3>
                                        {company.focus && <p className="experience-focus">{company.focus}</p>}
                                    </div>
                                    <div className="experience-meta" aria-label={`${company.duration}, ${company.location}`}>
                                        <span className="experience-duration">{company.duration}</span>
                                        <span>{company.location}</span>
                                    </div>
                                </header>

                                {company.metrics && (
                                    <div className="experience-metrics" aria-label={`${company.name} selected outcomes`}>
                                        {company.metrics.map(metric => (
                                            <div className="experience-metric" key={`${company.name}-${metric.label}`}>
                                                <strong>{metric.value}</strong>
                                                <span>{metric.label}</span>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <ul className="experience-bullets">
                                    {company.achievements.map(achievement => (

        const CaseStudySection = ({ title, children }) => (
            <section className="case-study-section">
                <h4>{title}</h4>
                {children}
            </section>
        );

        const Projects = () => {
            const { projects } = window.PORTFOLIO_DATA;
            const [activeProject, setActiveProject] = useState(null);
            const caseStudyTrigger = useRef(null);
            const caseStudyDialog = useRef(null);

            const closeCaseStudy = () => {
                setActiveProject(null);
                window.requestAnimationFrame(() => caseStudyTrigger.current?.focus());
            };

            useEffect(() => {
                document.body.style.overflow = activeProject ? 'hidden' : '';

                if (activeProject) {
                    window.requestAnimationFrame(() => {
                        caseStudyDialog.current?.querySelector('.case-study-close')?.focus();
                    });
                }

                const closeOnEscape = (event) => {
                    if (event.key === 'Escape' && activeProject) closeCaseStudy();

                    if (event.key === 'Tab' && activeProject && caseStudyDialog.current) {
                        const focusable = [...caseStudyDialog.current.querySelectorAll('a[href], button:not([disabled]), summary')];
                        if (!focusable.length) return;
                        const first = focusable[0];
                        const last = focusable[focusable.length - 1];

                        if (event.shiftKey && document.activeElement === first) {
                            event.preventDefault();
                            last.focus();
                        } else if (!event.shiftKey && document.activeElement === last) {
                            event.preventDefault();
                            first.focus();
                        }
                    }
                };

                document.addEventListener('keydown', closeOnEscape);
                return () => {
                    document.body.style.overflow = '';
                    document.removeEventListener('keydown', closeOnEscape);
                };
            }, [activeProject]);

            const openCaseStudy = (project, event) => {
                caseStudyTrigger.current = event.currentTarget;
                setActiveProject(project);
            };

            return (
                <section id="projects" className="container flagship-projects">
                    <div className="projects-heading">
                        <div>
                            <p className="section-eyebrow">Selected product work</p>
                            <h2 className="section-title">Flagship Projects</h2>
                        </div>
                        <p className="projects-intro">
                            Two quality-operations prototypes with distinct scopes: general annotation QA and RLHF preference data.
                        </p>
                    </div>

                    <div className="project-grid">
                        {projects.map((project, index) => (
                            <article className={`project-card glass-panel project-card-${index + 1}`} key={project.id}>
                                <div className="project-card-topline">
                                    <span className="project-index">0{index + 1}</span>
                                    <span className="project-category">{project.category}</span>
                                </div>

                                <div className="project-card-heading">
                                    <h3>{project.title}</h3>
                                    <p>{project.subtitle}</p>
                                </div>

                                <p className="project-description">{project.description}</p>

                                <div className="project-capabilities">
                                    <h4>Core capabilities</h4>
                                    <ul>
                                        {project.capabilities.map(capability => (
                                            <li key={capability}>{capability}</li>
                                        ))}
                                    </ul>
                                </div>

                                <div className="project-methods" aria-label={`${project.title} methods`}>
                                    {project.methods.map(method => (
                                        <span key={method}>{method}</span>
                                    ))}
                                </div>

                                <div className="project-actions">
                                    <button
                                        type="button"
                                        className="btn-secondary project-case-study-button"
                                        onClick={(event) => openCaseStudy(project, event)}
                                    >
                                        View Case Study
                                    </button>
                                    {project.demoUrl ? (
                                        <a
                                            href={project.demoUrl}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="btn-primary project-demo-link"
                                        >
                                            {project.demoLabel} <Icons.External />
                                        </a>
                                    ) : (
                                        <span className="project-coming-soon" aria-label={`${project.title} live demo coming soon`}>
                                            Live Demo · {project.demoLabel}
                                        </span>
                                    )}
                                </div>
                            </article>
                        ))}
                    </div>

                    {activeProject && activeProject.caseStudy && (
                        <div className="case-study-backdrop" onClick={closeCaseStudy}>
                            <article
                                className="case-study-dialog"
                                ref={caseStudyDialog}
                                role="dialog"
                                aria-modal="true"
                                aria-labelledby="case-study-title"
                                onClick={(event) => event.stopPropagation()}
                            >
                                <header className="case-study-header">
                                    <div>
                                        <p>{activeProject.category} · Case Study</p>
                                        <h3 id="case-study-title">{activeProject.caseStudy.title}</h3>
                                    </div>
                                    <button type="button" className="case-study-close" onClick={closeCaseStudy} aria-label="Close case study">
                                        ×
                                    </button>
                                </header>

                                <div className="case-study-content">
                                    <div className="case-study-summary-grid">
                                        <CaseStudySection title="Problem">
                                            <p>{activeProject.caseStudy.problem}</p>
                                        </CaseStudySection>
                                        <CaseStudySection title="Solution">
                                            <p>{activeProject.caseStudy.solution}</p>
                                        </CaseStudySection>
                                    </div>

                                    <CaseStudySection title="Workflow">
                                        <ol className="case-study-workflow">
                                            {activeProject.caseStudy.workflow.map(item => <li key={item}>{item}</li>)}
                                        </ol>
                                    </CaseStudySection>

                                    <div className="case-study-detail-grid">
                                        <CaseStudySection title="Quality Methods">
                                            <ul>
                                                {activeProject.caseStudy.qualityMethods.map(item => <li key={item}>{item}</li>)}
                                            </ul>
                                        </CaseStudySection>
                                        <CaseStudySection title="Technical Implementation">
                                            <ul>
                                                {activeProject.caseStudy.technicalImplementation.map(item => <li key={item}>{item}</li>)}
                                            </ul>
                                        </CaseStudySection>
                                    </div>

                                    <CaseStudySection title="Why I Built It">
                                        <p>{activeProject.caseStudy.whyBuilt}</p>
                                    </CaseStudySection>

                                    <p className="case-study-disclosure">{activeProject.caseStudy.disclosure}</p>
                                </div>

                                <footer className="case-study-footer">
                                    {activeProject.demoUrl ? (
                                        <a href={activeProject.demoUrl} target="_blank" rel="noopener noreferrer" className="btn-primary project-demo-link">
                                            Open Live Demo <Icons.External />
                                        </a>
                                    ) : (
                                        <span className="project-coming-soon">Live Demo · Coming Soon</span>
                                    )}
                                    <button type="button" className="btn-secondary" onClick={closeCaseStudy}>Close</button>
                                </footer>
                            </article>
                        </div>
                    )}
                </section>
            );
        };

        const Education = () => {
            const { education, certifications } = window.PORTFOLIO_DATA;
            return (
                <section id="education" className="container" aria-labelledby="education-heading">
                    <h2 id="education-heading" className="section-title">Education &amp; Certifications</h2>
                    <div className="education-cert-grid">
                        <div className="education-list" aria-label="Education">
                            {education.map((edu, index) => (
                                <article key={edu.degree} className="glass-panel education-item">
                                    <div className="education-content">
                                        <p className="education-degree">{edu.degree}</p>
                                        <h3>{edu.field}</h3>
                                        <p className="education-school">{edu.school}</p>
                                        {edu.detail && <p className="education-detail">{edu.detail}</p>}
                                    </div>
                                    <span className="education-year">{edu.status}</span>
                                </article>
                            ))}
                        </div>
                        <aside className="glass-panel certification-list" aria-labelledby="certifications-heading">
                            <h3 id="certifications-heading">Selected Certifications</h3>
                            <ul className="featured-certifications">
                                {certifications.featured.map(cert => (
                                    <li key={cert}>
                                        <span className="certification-marker" aria-hidden="true"></span>
                                        {cert}
                                    </li>
                                ))}
                            </ul>
                            <details className="additional-certifications">
                                <summary>Additional certifications</summary>
                                <ul>
                                    {certifications.additional.map(cert => <li key={cert}>{cert}</li>)}
                                </ul>
                            </details>
                        </aside>
                    </div>
                </section>
            );
        };

        const Contact = () => {
            const { personal } = window.PORTFOLIO_DATA;
            const resumeHref = personal.resumeUrl || `mailto:${personal.email}?subject=Resume Request`;

            return (
                <section id="contact" className="container contact-section" aria-labelledby="contact-heading">
                    <div className="contact-panel glass-panel">
                        <p className="section-eyebrow">Contact</p>
                        <h2 id="contact-heading">Let's Connect</h2>
                        <p className="contact-copy">
                            I'm interested in opportunities across AI Data Operations, AI Evaluation, Technical QA, and AI Project Operations.
                        </p>
                        <div className="contact-actions" aria-label="Contact options">
                            <a href={personal.linkedin} target="_blank" rel="noopener noreferrer" className="btn-primary">
                                <Icons.Linkedin /> LinkedIn
                            </a>
                            <a href={`mailto:${personal.email}`} className="btn-secondary">
                                <Icons.Mail /> Email
                            </a>
                            <a href={resumeHref} className="contact-text-link">
                                Request Resume
                            </a>
                        </div>
                    </div>
                </section>
            );
        }

        const Footer = () => {
            return (
                <footer className="site-footer">
                    <div className="container site-footer-inner">
                        <span>© 2026 Kevin Prashant Veigas. All rights reserved.</span>
                        <a href="#top">Back to top</a>
                    </div>
                </footer>
            );
        }

        const App = () => {
            return (
                <React.Fragment>
                    <WaveBackground />
                    <div className="vignette-overlay" aria-hidden="true"></div>
                    <Navbar />
                    <main id="main-content" tabIndex="-1">
                        <Hero />
                        <ImpactStrip />
                        <Experience />
                        <Projects />
                        <CoreCapabilities />
                        <Education />
                        <Contact />
                    </main>
                    <Footer />
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
